# A push that adds or changes a release's data has bedrock-data-generator regenerate minecraft-data from that commit.
# A preview's data (preview/) changes nothing the generator reads. Running another repo's workflow takes a token
# (GENERATOR_DISPATCH_TOKEN); without one this does nothing, and the generator's own schedule picks the commit up
# within the hour after the extractor's.
name: notify generator

on:
  push:
    branches: [main]
    paths: ['release/**']
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GENERATOR_DISPATCH_TOKEN }}
      GENERATOR_REPO: ${{ vars.GENERATOR_REPO }}
    steps:
      - name: Run the generator on this commit
        if: env.GH_TOKEN != ''
        run: gh workflow run generate.yml --repo "$GENERATOR_REPO" --ref main -f data_ref="$GITHUB_SHA"
      - name: No token to run it with
        if: env.GH_TOKEN == ''
        run: echo "::notice::no GENERATOR_DISPATCH_TOKEN; $GENERATOR_REPO's schedule picks this commit up"
